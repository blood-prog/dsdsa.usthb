<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="feltGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="50%" stop-color="#c84b31"/>
      <stop offset="100%" stop-color="#942a15"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f0eee9"/>
      <stop offset="100%" stop-color="#d6d0c4"/>
    </radialGradient>
    <filter id="feltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Yarn Horn / Ear -->
  <path d="M 17 21 C 12 11, 21 7, 25 15 Z" fill="#dfbe88" stroke="#181716" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right Yarn Horn / Ear -->
  <path d="M 47 21 C 52 11, 43 7, 39 15 Z" fill="#dfbe88" stroke="#181716" stroke-width="2" stroke-linejoin="round"/>

  <!-- Main Felt Monster Body -->
  <rect x="8" y="14" width="48" height="44" rx="20" fill="url(#feltGrad)" stroke="#181716" stroke-width="2.5" filter="url(#feltShadow)"/>

  <!-- Felt Stitches / Texture Details -->
  <path d="M 12 28 C 11 34, 11 40, 13 46" fill="none" stroke="#f6c83b" stroke-width="1.5" stroke-dasharray="2.5 2" stroke-linecap="round"/>
  <path d="M 52 28 C 53 34, 53 40, 51 46" fill="none" stroke="#f6c83b" stroke-width="1.5" stroke-dasharray="2.5 2" stroke-linecap="round"/>

  <!-- Left Eye -->
  <circle cx="23" cy="30" r="8" fill="url(#eyeGrad)" stroke="#181716" stroke-width="2"/>
  <circle cx="24.5" cy="29.5" r="4" fill="#181716"/>
  <circle cx="26" cy="28" r="1.5" fill="#ffffff"/>

  <!-- Right Eye -->
  <circle cx="41" cy="30" r="8" fill="url(#eyeGrad)" stroke="#181716" stroke-width="2"/>
  <circle cx="39.5" cy="29.5" r="4" fill="#181716"/>
  <circle cx="41" cy="28" r="1.5" fill="#ffffff"/>

  <!-- Cheerful / Playful Smile -->
  <path d="M 23 43 C 27 50, 37 50, 41 43" fill="#181716" stroke="#181716" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cute Tongue -->
  <path d="M 28 46 C 30 50, 34 50, 36 46 Z" fill="#ff7a59"/>
  <!-- Little Felt Fang -->
  <polygon points="26,43 29,43 27.5,46" fill="#ffffff"/>

  <!-- Cute Rosy Cheeks -->
  <ellipse cx="14" cy="38" rx="3" ry="2" fill="#ff9980" opacity="0.6"/>
  <ellipse cx="50" cy="38" rx="3" ry="2" fill="#ff9980" opacity="0.6"/>
</svg>
